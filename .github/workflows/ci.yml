name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check scripts
        run: |
          node --check scripts/migrate.mjs
          node --check scripts/seed.mjs
          node --check scripts/password.mjs
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://user:pass@127.0.0.1:5432/familytree
